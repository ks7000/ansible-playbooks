############################################################
# Comunidad DO / Comunidad KS7000: Apache2 en Ubuntu 22.04 #
############################################################
---
- name: Configurar servidor web Apache en Ubuntu 22.04
  hosts: servidor_202
  become: true
  vars_files:
    - vars/default.yml

  tasks:
    - name: Verificar si es Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] == "22.04"
        fail_msg: "Este libreto está diseñado solamente para Ubuntu 22.04 ."

    - name: Prerrequisitos de instalación
      ansible.builtin.apt:
        name: aptitude
        update_cache: true
        state: present
        force_apt_get: true

    - name: Instalación de Apache2
      ansible.builtin.apt:
        name: apache2
        update_cache: true
        state: present
        force_apt_get: true

    - name: Crear documento raíz
      ansible.builtin.file:
        path: "/var/www/{{ http_host }}"
        state: directory
        owner: "{{ app_user }}"
        mode: '0755'

    - name: Copiar página HTML de prueba
      ansible.builtin.template:
        src: "files/index.html.j2"
        dest: "/var/www/{{ http_host }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Configurar anfitrión virtual en Apache2
      ansible.builtin.template:
        src: "files/apache.conf.j2"
        dest: "/etc/apache2/sites-available/{{ http_conf }}"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Habilitar nuevo sitio web
      ansible.builtin.command:
        cmd: "/usr/sbin/a2ensite {{ http_conf }}"
        creates: "/etc/apache2/sites-enabled/{{ http_conf }}"
      notify: Recargar Apache2

    - name: Deshabilitar sitio web por defecto de Apache2
      ansible.builtin.command:
        cmd: /usr/sbin/a2dissite 000-default.conf
        removes: /etc/apache2/sites-enabled/000-default.conf
      when: disable_default
      notify: Recargar Apache2

    - name: Instalación de cortafuegos UFW
      ansible.builtin.apt:
        name: ufw
        update_cache: true
        state: present
        force_apt_get: true

    - name: "Cortafuegos UFW: Permitir HTTP en el número de puerto {{ http_port }}"
      community.general.ufw:
        rule: allow
        port: "{{ http_port }}"
        proto: tcp

  handlers:
    - name: Recargar Apache2
      ansible.builtin.service:
        name: apache2
        state: reloaded

    - name: Reiniciar Apache2
      ansible.builtin.service:
        name: apache2
        state: restarted
