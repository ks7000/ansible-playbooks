repos:
  - repo: https://github.com
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com
    rev: v25.1.3  # You can update this later using 'pre-commit autoupdate'
    hooks:
      - id: ansible-lint
        # Optional: if your repo relies on extra collections from requirements.yml
        # additional_dependencies:
        #   - ansible-core
