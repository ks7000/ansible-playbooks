name: Pruebas de libretos Ansible (sintaxis con ansible-lint)

on:
  push:
    paths:
      - 'apache_ubuntu2204/**'
      - 'apache_ubuntu2404/**'
      - 'apache_ubuntu2604/**'
      - 'lamp_ubuntu2204/**'
      - 'lamp_ubuntu2404/**'
      - 'lamp_ubuntu2604/**'
      - '.github/workflows/test-playbooks.yml'
  pull_request:
    paths:
      - 'apache_ubuntu2204/**'
      - 'apache_ubuntu2404/**'
      - 'apache_ubuntu2604/**'
      - 'lamp_ubuntu2204/**'
      - 'lamp_ubuntu2404/**'
      - 'lamp_ubuntu2604/**'
      - '.github/workflows/test-playbooks.yml'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-syntax:
    name: Verificación de sintaxis de código con Ansible-Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Paso 01 - Copia (o retira) de este repositorio a ser comprobado
        uses: actions/checkout@v7

      - name: Paso 02 - Establece (o remueve) Python 3.11 como herramienta predeterminada
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Paso 03.0 - Instalar Ansible y Ansible-Lint
        run: |
          pipx install ansible ansible-lint

      - name: Paso 03.1 - Instalar community.general collection
        run: ansible-galaxy collection install community.general --force 

      - name: Paso 04.1 - Verificación de sintaxis de libreto de apache_ubuntu2204
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook --syntax-check "$playbook"
          done
      - name: Paso 04.2 - Ejecuta Ansible-Lint en apache_ubuntu2204
        run: |
          ansible-lint apache_ubuntu2204/

      - name: Paso 05.1 - Verificación de sintaxis de libreto de apache_ubuntu2404
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook -i localhost --syntax-check "$playbook"
          done
      - name: Paso 05.2 - Ejecuta Ansible-Lint en apache_ubuntu2404
        run: |
          ansible-lint apache_ubuntu2404/

      - name: Paso 06.1 - Verificación de sintaxis de libreto de apache_ubuntu2604
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook -i localhost --syntax-check "$playbook"
          done
      - name: Paso 06.2 - Ejecuta Ansible-Lint en apache_ubuntu2604
        run: |
          ansible-lint apache_ubuntu2604/

      - name: Paso 07.1 - Verificación de sintaxis de libreto de lamp_ubuntu2204
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook -i localhost --syntax-check "$playbook"
          done
      - name: Paso 07.2 - Ejecuta Ansible-Lint en lamp_ubuntu2204
        run: |
          ansible-lint lamp_ubuntu2204/

      - name: Paso 08.1 - Verificación de sintaxis de libreto de lamp_ubuntu2404
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook -i localhost --syntax-check "$playbook"
          done
      - name: Paso 08.2 - Ejecuta Ansible-Lint en lamp_ubuntu2404
        run: |
          ansible-lint lamp_ubuntu2404/

      - name: Paso 09.1 - Verificación de sintaxis de libreto de lamp_ubuntu2604
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook -i localhost --syntax-check "$playbook"
          done
      - name: Paso 09.2 - Ejecuta Ansible-Lint en lamp_ubuntu2604
        run: |
          ansible-lint lamp_ubuntu2604/
