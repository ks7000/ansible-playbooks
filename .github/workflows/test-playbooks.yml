name: Pruebas de libretos Ansible (sintaxis)

on:
  push:
#    branches: ["main"]
    paths:
      - 'apache_ubuntu2204/**'
      - '.github/workflows/playbook.yml'
  pull_request:
#    branches: ["main"]
    paths:
      - 'apache_ubuntu2204/**'
      - '.github/workflows/playbook.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-syntax:
    name: Verificación de sintaxis de código con Ansible-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Copia de este repositorio a ser comprobado
        uses: actions/checkout@v4

      - name: Establece Python 3.11 como herramienta predeterminada
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala Ansible y Ansible-Lint
        run: |
          pip install ansible ansible-lint

      - name: Ejecuta Ansible-Lint
        run: |
          ansible-lint

      - name: Verificación de sintaxis de libreto
        run: |
          for playbook in */playbook.yml; do
            echo "Verificando sintaxis de $playbook..."
            ansible-playbook --syntax-check "$playbook"
          done
