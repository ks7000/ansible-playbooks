#########################################################
# Comunidad DO / Comunidad KS7000: LAMP en Ubuntu 26.04 #
#########################################################
---
- name: Configurar LAMP en Ubuntu 26.04
  hosts: servidor_211
  become: true
  vars_files:
    - vars/default.yml

  tasks:
    - name: Paso 01 - Instalar prerrequisitos
      ansible.builtin.apt:
        name: "{{ item }}"
        update_cache: true
        state: present
        force_apt_get: true
      loop: ["aptitude"]

    - name: Paso 02 - Instalar paquetes LAMP
      ansible.builtin.apt:
        name: "{{ item }}"
        update_cache: true
        state: present
      loop: ["apache2", "mysql-server", "python3-pymysql", "php", "php-mysql", "libapache2-mod-php", "nano"]

    - name: Paso 03.1 - Crea directorio raíz de anfitrión (Apache2)
      ansible.builtin.file:
        path: "/var/www/{{ http_host }}"
        state: directory
        owner: "{{ app_user }}"
        mode: "0755"

    - name: Paso 03.2 - Configurar anfitrión virtual (Apache2)
      ansible.builtin.template:
        src: "files/apache.conf.j2"
        dest: "/etc/apache2/sites-available/{{ http_conf }}"
        owner: www-data
        group: www-data
        mode: "0644"
      notify: Recargar Apache2

    - name: Paso 03.3 - Habilitar nuevo sitio web (Apache2)
      ansible.builtin.command:
        cmd: "/usr/sbin/a2ensite {{ http_conf }}"
        creates: "/etc/apache2/sites-enabled/{{ http_conf }}"
      notify: Recargar Apache2

    - name: Paso 03.4 - Deshabilitar sitio web por defecto de Apache2
      ansible.builtin.command:
        cmd: /usr/sbin/a2dissite 000-default.conf
        removes: /etc/apache2/sites-enabled/000-default.conf
      when: disable_default
      notify: Recargar Apache2

    - name: Paso 04.1 - Verificar que (MySQL 8.4 / 9) está en ejecución y habilitado
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Paso 04.2 - Configurar contraseña de usuario root (MySQL 8.4 / 9) con ALTER USER via Unix socket
      ansible.builtin.command:
        cmd: >
          mysql --protocol=socket -u root -e
          "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '{{ mysql_root_password }}'; FLUSH PRIVILEGES;"
      register: mysql_root_set
      changed_when: mysql_root_set.rc == 0
      failed_when:
        - mysql_root_set.rc != 0
        - "'Acceso denegado' mysql_root_set.rc != 0"

    - name: Paso 04.3 - Crear /root/.my.cnf para iniciar sesión root desde credenciales locales
      ansible.builtin.copy:
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ mysql_root_password }}

    - name: Paso 04.4 - Retirar la base de datos de prueba (MySQL)
      become: true
      ansible.mysql.mysql_db:
        name: test
        state: absent
        login_host: localhost
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Paso 04.5 - Retirar todas las cuentas de usuario anónimas (MySQL)
      become: true
      ansible.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent
        login_host: localhost
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Paso 04.6 - Crear una base de datos nueva en MySQL 8.4 / 9
      ansible.mysql.mysql_db:
        name: "app_production2"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Paso 05.1 - Instalación de cortafuegos UFW
      ansible.builtin.apt:
        name: ufw
        update_cache: true
        state: present

    - name: "Paso 05.2 - Permitir HTTP en UFW para el número de puerto {{ http_port }}"
      community.general.ufw:
        rule: allow
        port: "{{ http_port }}"
        proto: tcp

    - name: Paso 06 - Copiar página de información PHP
      ansible.builtin.template:
        src: "files/info.php.j2"
        dest: "/var/www/{{ http_host }}/info.php"
        owner: www-data
        group: www-data
        mode: "0644"

  handlers:
    - name: Recargar Apache2
      ansible.builtin.service:
        name: apache2
        state: reloaded

    - name: Reiniciar Apache2
      ansible.builtin.service:
        name: apache2
        state: restarted
