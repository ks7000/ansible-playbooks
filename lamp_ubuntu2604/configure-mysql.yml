---
- name: Configure MySQL 8.4 Root Password and Client Credentials
  hosts: servidor_211
  become: true
  vars:
    mysql_root_password: "YourSuperSecureRootPassword123!"
    mysql_socket: "/var/run/mysqld/mysqld.sock"

  pre_tasks:
    - name: Ensure PyMySQL and dependencies are installed for Ansible database modules
      ansible.builtin.apt:
        name:
          - python3-pymysql
          - python3-mysqldb
        state: present
        update_cache: true

  tasks:
    - name: Ensure MySQL service is started and enabled
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    - name: Set MySQL root password idempotently using caching_sha2_password
      community.mysql.mysql_user:
        name: root
        host: "{{ item }}"
        password: "{{ mysql_root_password }}"
        plugin: caching_sha2_password
        login_unix_socket: "{{ mysql_socket }}"
        state: present
      loop:
        - "localhost"
        - "127.0.0.1"
        - "::1"

    - name: Drop root client credentials configuration file (~/.my.cnf)
      community.builtin.template:
        src: root-my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'

    - name: Verify MySQL connection using the new password credentials
      community.mysql.mysql_info:
        login_unix_socket: "{{ mysql_socket }}"
      register: mysql_verification
      changed_when: false
